<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #0f766e; stroke-width: 2; rx: 12; }
      .ai { fill: #fff7e6; stroke: #b45309; stroke-width: 1.5; rx: 8; }
      .title { font-size: 22px; font-weight: 700; fill: #17211c; }
      .h { font-size: 17px; font-weight: 700; fill: #0f766e; }
      .sub { font-size: 12px; fill: #5b6b62; }
      .t { font-size: 13px; fill: #17211c; }
      .m { font-size: 12px; fill: #17211c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl { font-size: 12px; fill: #0f766e; font-weight: 600; }
      .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
      .strip { fill: #eaf4f1; stroke: #cfe5de; rx: 10; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f4f6f4"/>
  <text x="40" y="40" class="title">ZKanopy — zero-knowledge deforestation-free proofs for smallholder farmers</text>
  <text x="40" y="60" class="sub">EUDR cut-off 31 Dec 2020 · Base Sepolia · Groth16 (circom + snarkjs) · Poseidon Merkle grid</text>

  <!-- A: oracle -->
  <rect x="40" y="90" width="420" height="250" class="box"/>
  <text x="60" y="120" class="h">A · Geospatial oracle</text>
  <text x="60" y="138" class="sub">Python + Node, runs offline · scripts oracle/01–05</text>
  <text x="60" y="166" class="t">• GEE: Hansen GFC v1.12 lossyear + Sentinel-2 NDVI 2020 / 2025</text>
  <text x="60" y="188" class="t">• 200 × 200 cells of ~100 m (Gayo highlands, Aceh) → clean / loss</text>
  <rect x="60" y="202" width="380" height="52" class="ai"/>
  <text x="70" y="222" class="t"><tspan font-weight="700" fill="#b45309">AI #1 · RandomForest QC</tspan> (NDVI features vs. Hansen)</text>
  <text x="70" y="242" class="t">final = hansen ∧ ai · disagreements → review queue</text>
  <text x="60" y="278" class="t">• leaf = Poseidon(row, col, label) · depth-16 Merkle tree → root</text>
  <text x="60" y="300" class="t">• publishes tree / checkpoint / metadata.json (sha256 on-chain)</text>
  <text x="60" y="322" class="t">• registers the root once per grid version (oracle wallet)</text>

  <!-- C: contracts -->
  <rect x="740" y="90" width="420" height="250" class="box"/>
  <text x="760" y="120" class="h">C · Smart contracts</text>
  <text x="760" y="138" class="sub">Solidity 0.8.24 · Foundry · Base Sepolia</text>
  <text x="760" y="166" class="t">• Groth16Verifier.sol — generated by snarkjs</text>
  <text x="760" y="188" class="t">• Registry.sol — registerRoot(Grid) by the oracle</text>
  <text x="760" y="210" class="t">• attest(proof, pubSignals, gridId, commodityHash):</text>
  <text x="780" y="230" class="m">root &amp; grid → exporter → proof → nullifier</text>
  <text x="760" y="254" class="t">• reverts by name: UnknownRootOrGrid, ExporterMismatch,</text>
  <text x="774" y="274" class="t">InvalidProof, NullifierAlreadyUsed</text>
  <text x="760" y="298" class="t">• stores Attestation, emits Attested — public claim log</text>
  <text x="760" y="322" class="m">Registry 0xd5569a45…4D852f · Verifier 0x0d895818…21ffBb</text>

  <!-- A -> C -->
  <line x1="460" y1="120" x2="738" y2="120" class="arrow"/>
  <text x="600" y="110" text-anchor="middle" class="lbl">registerRoot(root, grid, metadata hash)</text>

  <!-- B: prover -->
  <rect x="40" y="400" width="420" height="220" class="box"/>
  <text x="60" y="430" class="h">B · Prover — runs in the farmer's browser</text>
  <text x="60" y="448" class="sub">snarkjs groth16.fullProve · ~0.5 s on a laptop</text>
  <text x="60" y="476" class="t">• Merkle path computed locally (tree.json + checkpoint.json)</text>
  <text x="60" y="498" class="t">• circuit DeforestationFree(16) — for latitude and longitude:</text>
  <text x="80" y="518" class="m">lat0S + row·stepS ≤ latS &lt; lat0S + (row+1)·stepS</text>
  <text x="80" y="538" class="m">leaf = Poseidon(row, col, 1) ∈ tree(root)</text>
  <text x="80" y="558" class="m">nullifier = Poseidon(row, col, season)</text>
  <text x="60" y="584" class="t">• private: latS, lonS, row, col, path — never leave the device</text>
  <text x="60" y="604" class="t">• output: proof + public signals only</text>

  <!-- D: frontend -->
  <rect x="740" y="400" width="420" height="220" class="box"/>
  <text x="760" y="430" class="h">D · Frontend</text>
  <text x="760" y="448" class="sub">Vite + React + TypeScript · wagmi + viem · Leaflet</text>
  <text x="760" y="476" class="t">• /farmer — tap a plot → proof → attest transaction</text>
  <text x="760" y="498" class="t">• /exporter — your attestations → DDS JSON export</text>
  <text x="760" y="520" class="t">• /verify/:id — public attestation + grid, no wallet</text>
  <rect x="760" y="538" width="380" height="56" class="ai"/>
  <text x="770" y="558" class="t"><tspan font-weight="700" fill="#b45309">AI #2 · IsolationForest</tspan> over Attested events</text>
  <text x="770" y="578" class="t">/regulator — risk per exporter: bursts, volume, timing</text>

  <!-- A -> B -->
  <line x1="250" y1="340" x2="250" y2="398" class="arrow"/>
  <text x="262" y="374" class="lbl">public grid: tree.json (all leaves), checkpoint.json</text>

  <!-- B <-> D -->
  <line x1="460" y1="510" x2="738" y2="510" class="arrow2"/>
  <text x="600" y="500" text-anchor="middle" class="lbl">proof + public signals</text>

  <!-- D -> C and C -> D -->
  <line x1="930" y1="398" x2="930" y2="342" class="arrow"/>
  <text x="942" y="362" class="lbl">attest(...)</text>
  <line x1="1010" y1="342" x2="1010" y2="398" class="arrow"/>
  <text x="1022" y="380" class="lbl">Attested events, getGrid</text>

  <!-- public signals strip -->
  <rect x="40" y="640" width="1120" height="60" class="strip"/>
  <text x="60" y="664" class="t"><tspan font-weight="700">What the chain sees:</tspan> public signals <tspan class="m">[nullifier, root, season, exporter, lat0S, lon0S, stepS]</tspan> + gridId + commodityHash</text>
  <text x="60" y="686" class="t"><tspan font-weight="700">What it never sees:</tspan> the plot's latitude/longitude or its cell — the nullifier is preimage-resistant, yet a second claim on the same cell and season is rejected.</text>
</svg>
