[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Registry.t.sol reads the Groth16 fixture produced by circuits/build.sh.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
base_sepolia = "${RPC_URL}"

[fmt]
line_length = 120
